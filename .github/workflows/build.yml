name: Build

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  # Branches are covered by pull_request below; restricting push to main
  # avoids running every job twice (push + PR) for the same commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── PlayStation 2 ─────────────────────────────────────────────────────
  build-ps2:
    timeout-minutes: 45
    name: PlayStation 2
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Install build tools
        run: sudo apt update && sudo apt install -y ninja-build ccache

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-ps2-${{ github.run_id }}
          restore-keys: |
            ccache-ps2-

      - name: Configure ccache
        run: ccache --max-size=2G && ccache --set-config=compression=true

      - name: Prepare ps2dev directory permissions
        run: |
          sudo mkdir -p /usr/local/ps2dev
          sudo chown -R $USER:$USER /usr/local/ps2dev

      - name: Cache ps2dev toolchain
        id: cache-ps2dev
        uses: actions/cache@v6
        with:
          path: /usr/local/ps2dev
          key: cache-ps2dev-2026-05-17

      - name: Install ps2dev toolchain
        if: steps.cache-ps2dev.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /usr/local/ps2dev
          curl -fSL -o /tmp/ps2dev.tar.gz \
            https://github.com/ps2dev/ps2dev/releases/download/latest/ps2dev-ubuntu-latest.tar.gz
          sudo tar -xf /tmp/ps2dev.tar.gz --strip-components 1 -C /usr/local/ps2dev
          rm -f /tmp/ps2dev.tar.gz

      - name: Set environment
        run: |
          echo "PS2DEV=/usr/local/ps2dev" >> "$GITHUB_ENV"
          echo "PS2SDK=/usr/local/ps2dev/ps2sdk" >> "$GITHUB_ENV"
          echo "/usr/local/ps2dev/ee/bin" >> "$GITHUB_PATH"
          echo "/usr/local/ps2dev/ps2sdk/bin" >> "$GITHUB_PATH"
          echo "/usr/local/ps2dev/bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -B build/ps2-release -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/ps2_toolchain.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MAKE_PROGRAM=ninja
          -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          -DPLATFORM=PS2
          -DPS2_ENABLE_SOUND=ON
          -DPS2_ENABLE_PERSPECTIVE_TEXTURES=ON
          -DPS2_RENDER_STATS=OFF
          -DPS2_ENABLE_VU1_TERRAIN=ON
          -DMC_LOG_LEVEL=0
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/ps2-release --parallel

      - name: Package
        run: |
          mkdir -p dist
          cp bin/ps2/usb/MCBETA/OptiCraft.elf dist/OptiCraft-ps2.elf
          tar -C dist -czf OptiCraft-ps2.tar.gz OptiCraft-ps2.elf

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-ps2
          path: OptiCraft-ps2.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats

  # ── Nintendo Wii ──────────────────────────────────────────────────────
  build-wii:
    timeout-minutes: 45
    name: Nintendo Wii
    runs-on: ubuntu-26.04
    container:
      image: devkitpro/devkitppc:20260503
    steps:
      - name: Install build dependencies
        run: apt update && apt install -y git cmake ninja-build ccache

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-wii-${{ github.run_id }}
          restore-keys: |
            ccache-wii-

      - name: Configure ccache
        run: ccache --max-size=2G && ccache --set-config=compression=true

      - name: Configure
        run: >
          cmake -B build/wii-release -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/wii_toolchain.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MAKE_PROGRAM=ninja
          -DPLATFORM=WII
          -DWII_BRINGUP=OFF
          -DWII_ENABLE_SOUND=ON
          -DWII_ENABLE_NETWORK=ON
          -DCMAKE_CXX_FLAGS="-DHW_RVL -mrvl -mcpu=750 -meabi -mhard-float -I$GITHUB_WORKSPACE/src/net/minecraft/src"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/wii-release --parallel

      - name: Package
        run: |
          mkdir -p dist
          cp bin/wii/OptiCraft.elf dist/OptiCraft-wii.elf
          [ -f bin/wii/sd/apps/OptiCraft/boot.dol ] && \
            cp bin/wii/sd/apps/OptiCraft/boot.dol dist/ || true
          tar -C dist -czf OptiCraft-wii.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-wii
          path: OptiCraft-wii.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats

  # ── Windows x64 GCC (MinGW) ──────────────────────────────────────────
  build-windows-x64-gcc:
    timeout-minutes: 45
    name: Windows x64 GCC
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if not exist "external\SDL_net\CMakeLists.txt" (
            echo Cloning SDL_net...
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            cd external\SDL_net
            git fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git checkout FETCH_HEAD
          ) else (
            echo SDL_net already present
          )
        shell: cmd

      - name: Install ccache
        run: choco install ccache -y
        shell: pwsh

      - name: Configure ccache dir
        run: echo "CCACHE_DIR=${{ github.workspace }}\.ccache" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\.ccache
          key: ccache-windows-${{ github.run_id }}
          restore-keys: |
            ccache-windows-

      - name: Configure
        run: >
          cmake -B build/gcc-release -G Ninja
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MAKE_PROGRAM=ninja
          -DMC_LOG_LEVEL=2
          "-DCMAKE_CXX_FLAGS=-I${{ github.workspace }}/src/net/minecraft/src"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/gcc-release --parallel

      - name: Package
        run: |
          mkdir dist
          cp bin/Release/OptiCraft.exe dist/OptiCraft-windows-x64-gcc.exe
          tar -C dist -czf OptiCraft-windows-x64-gcc.tar.gz OptiCraft-windows-x64-gcc.exe
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-windows-x64-gcc
          path: OptiCraft-windows-x64-gcc.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats || echo "ccache not available"
        shell: bash

  # ── Windows GCC variants: x86_64 micro-architecture levels ──────────
  # Same steps as Windows x64 GCC (MinGW gcc from the image's PATH, which
  # ships GCC 15.x and thus knows x86-64-v3/znver3/znver4); only -march
  # differs, applied to both C and C++ flags. -march only selects code
  # generation, so these binaries are produced on the generic x64 runner --
  # the build host does not need that CPU, the resulting binary does.
  build-windows-gcc-variants:
    timeout-minutes: 45
    name: ${{ matrix.name }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64-v3 GCC
            suffix: x86_64-v3
            march: '-march=x86-64-v3'
          - name: Windows Zen 4 GCC
            suffix: zen4
            march: '-march=znver4'
          - name: Windows Zen 3 GCC
            suffix: zen3
            march: '-march=znver3'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if not exist "external\SDL_net\CMakeLists.txt" (
            echo Cloning SDL_net...
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            cd external\SDL_net
            git fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git checkout FETCH_HEAD
          ) else (
            echo SDL_net already present
          )
        shell: cmd

      - name: Install ccache
        run: choco install ccache -y
        shell: pwsh

      - name: Configure ccache dir
        run: echo "CCACHE_DIR=${{ github.workspace }}\.ccache" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\.ccache
          key: ccache-windows-${{ matrix.suffix }}-${{ github.run_id }}
          restore-keys: |
            ccache-windows-${{ matrix.suffix }}-

      - name: Configure
        run: >
          cmake -B build/gcc-release -G Ninja
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MAKE_PROGRAM=ninja
          -DMC_LOG_LEVEL=2
          "-DCMAKE_C_FLAGS=${{ matrix.march }}"
          "-DCMAKE_CXX_FLAGS=${{ matrix.march }} -I${{ github.workspace }}/src/net/minecraft/src"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/gcc-release --parallel

      - name: Package
        run: |
          mkdir dist
          cp bin/Release/OptiCraft.exe dist/OptiCraft-windows-${{ matrix.suffix }}-gcc.exe
          tar -C dist -czf OptiCraft-windows-${{ matrix.suffix }}-gcc.tar.gz OptiCraft-windows-${{ matrix.suffix }}-gcc.exe
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-windows-${{ matrix.suffix }}-gcc
          path: OptiCraft-windows-${{ matrix.suffix }}-gcc.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats || echo "ccache not available"
        shell: bash

  # ── Windows 32-bit GCC / Legacy GCC (MinGW32 via MSYS2) ──────────────
  # The image's gcc is x86_64 and not multilib, so -m32 cannot produce
  # 32-bit binaries. MINGW32's i686 gcc is natively 32-bit; on it the
  # presets' -m32 flag is a no-op. The presets' hardcoded VS Community
  # ninja path does not exist on the runner (Enterprise edition), so
  # CMAKE_MAKE_PROGRAM is overridden with MSYS2's ninja.
  build-windows-x86-gcc:
    timeout-minutes: 45
    name: ${{ matrix.name }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86 GCC
            preset: gcc32-release
            exe: OptiCraft-windows-x86-gcc.exe
            artifact: opticraft-windows-x86-gcc
          - name: Windows x86 Legacy GCC
            preset: gcc32-legacy-release
            exe: OptiCraft-windows-x86-gcc-legacy.exe
            artifact: opticraft-windows-x86-gcc-legacy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if not exist "external\SDL_net\CMakeLists.txt" (
            echo Cloning SDL_net...
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            cd external\SDL_net
            git fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git checkout FETCH_HEAD
          ) else (
            echo SDL_net already present
          )
        shell: cmd

      - name: Setup MSYS2 (MinGW32 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          path-type: minimal
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_MAKE_PROGRAM=ninja \
            "-DCMAKE_CXX_FLAGS=-m32 -msse2 -mfpmath=sse -I$(cygpath -m "$PWD")/src/net/minecraft/src"

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Package
        run: |
          mkdir dist
          cp bin/Release/OptiCraft.exe "dist/${{ matrix.exe }}"
          tar -C dist -czf "${{ matrix.exe }}.tar.gz" "${{ matrix.exe }}"
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.exe }}.tar.gz
          if-no-files-found: error

  # ── Windows ARM64 GCC (MinGW-w64 via MSYS2 CLANGARM64) ──────────────
  # No prebuilt GCC targets Windows ARM64 (the upstream aarch64-w64-mingw32
  # GCC port ships no binaries and its C++ EH/TLS support is still
  # incomplete), so the MinGW-w64/UCRT toolchain with clang in the gcc role
  # is used -- the arrangement MSYS2 itself recommends for the windows-11-arm
  # runner. Same shape as the Windows x86 MSYS2 job; -static mirrors the
  # link flags the CMakeLists GNU branch adds, keeping the .exe standalone
  # (static libc++/winpthread instead of runtime DLLs).
  build-windows-arm64-gcc:
    timeout-minutes: 45
    name: Windows ARM64 GCC
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if not exist "external\SDL_net\CMakeLists.txt" (
            echo Cloning SDL_net...
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            cd external\SDL_net
            git fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git checkout FETCH_HEAD
          ) else (
            echo SDL_net already present
          )
        shell: cmd

      - name: Setup MSYS2 (CLANGARM64 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          path-type: minimal
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-libc++
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -B build/gcc-release -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DMC_LOG_LEVEL=2 \
            "-DCMAKE_CXX_FLAGS=-I$(cygpath -m "$PWD")/src/net/minecraft/src" \
            -DCMAKE_EXE_LINKER_FLAGS=-static

      - name: Build
        shell: msys2 {0}
        run: cmake --build build/gcc-release --parallel

      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp bin/Release/OptiCraft.exe dist/OptiCraft-windows-arm64-gcc.exe
          tar -C dist -czf OptiCraft-windows-arm64-gcc.tar.gz OptiCraft-windows-arm64-gcc.exe

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-windows-arm64-gcc
          path: OptiCraft-windows-arm64-gcc.tar.gz
          if-no-files-found: error

  # ── Windows x64 MSVC ─────────────────────────────────────────────────
  build-windows-x64-msvc:
    timeout-minutes: 45
    name: Windows x64 MSVC
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if not exist "external\SDL_net\CMakeLists.txt" (
            echo Cloning SDL_net...
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            cd external\SDL_net
            git fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git checkout FETCH_HEAD
          ) else (
            echo SDL_net already present
          )
        shell: cmd

      - name: Configure
        # CXXFLAGS env is used (appended to cl's default /DWIN32 /W3 /EHsc via
        # CMAKE_CXX_FLAGS_INIT) instead of -DCMAKE_CXX_FLAGS, which would replace
        # those defaults.
        env:
          CXXFLAGS: -I${{ github.workspace }}/src/net/minecraft/src
        run: cmake -B build/msvc-release -G "Visual Studio 18 2026" -A x64 -DMC_LOG_LEVEL=2

      - name: Build
        run: cmake --build build/msvc-release --config Release --parallel

      - name: Package
        run: |
          mkdir dist
          cp bin/Release/OptiCraft.exe dist/OptiCraft-windows-x64-msvc.exe
          tar -C dist -czf OptiCraft-windows-x64-msvc.tar.gz OptiCraft-windows-x64-msvc.exe
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-windows-x64-msvc
          path: OptiCraft-windows-x64-msvc.tar.gz
          if-no-files-found: error

  # ── Linux x64 GCC ────────────────────────────────────────────────────
  build-linux-x64-gcc:
    timeout-minutes: 45
    name: Linux x64 GCC
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if [ ! -f external/SDL_net/CMakeLists.txt ]; then
            echo "Cloning SDL_net..."
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            git -C external/SDL_net fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git -C external/SDL_net checkout FETCH_HEAD
          else
            echo "SDL_net already present"
          fi

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y ninja-build ccache \
            libgl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libasound2-dev

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-x64-${{ github.run_id }}
          restore-keys: |
            ccache-linux-x64-

      - name: Configure ccache
        run: ccache --max-size=2G && ccache --set-config=compression=true

      - name: Configure
        run: >
          cmake -B build/gcc-release -G Ninja
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MAKE_PROGRAM=ninja
          -DMC_LOG_LEVEL=2
          "-DCMAKE_CXX_FLAGS=-I$GITHUB_WORKSPACE/src/net/minecraft/src"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/gcc-release --parallel

      - name: Package
        run: |
          mkdir dist
          cp bin/Release/OptiCraft dist/OptiCraft-linux-x64-gcc
          tar -C dist -czf OptiCraft-linux-x64-gcc.tar.gz OptiCraft-linux-x64-gcc

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-linux-x64-gcc
          path: OptiCraft-linux-x64-gcc.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats

  # ── Linux GCC variants: native ARM64 + x86_64 micro-arch levels ─────
  # Same steps as Linux x64 GCC; only the runner and the -march level
  # differ. -march only selects code generation, so the Zen/x86_64-v3
  # binaries are produced on the generic x64 runner -- the build host does
  # not need that CPU, the resulting binary does. The ARM64 entry runs the
  # identical steps natively on ubuntu-26.04-arm (arm64 joined
  # archive.ubuntu.com in 26.04, so the stock sources work unchanged).
  build-linux-gcc-variants:
    timeout-minutes: 45
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64 GCC
            runner: ubuntu-26.04-arm
            suffix: arm64
            march: ''
          - name: Linux x86_64-v3 GCC
            runner: ubuntu-26.04
            suffix: x86_64-v3
            march: '-march=x86-64-v3'
          - name: Linux Zen 4 GCC
            runner: ubuntu-26.04
            suffix: zen4
            march: '-march=znver4'
          - name: Linux Zen 3 GCC
            runner: ubuntu-26.04
            suffix: zen3
            march: '-march=znver3'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if [ ! -f external/SDL_net/CMakeLists.txt ]; then
            echo "Cloning SDL_net..."
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            git -C external/SDL_net fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git -C external/SDL_net checkout FETCH_HEAD
          else
            echo "SDL_net already present"
          fi

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y ninja-build ccache \
            libgl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libasound2-dev

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.suffix }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ matrix.suffix }}-

      - name: Configure ccache
        run: ccache --max-size=2G && ccache --set-config=compression=true

      - name: Configure
        run: >
          cmake -B build/gcc-release -G Ninja
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MAKE_PROGRAM=ninja
          -DMC_LOG_LEVEL=2
          "-DCMAKE_C_FLAGS=${{ matrix.march }}"
          "-DCMAKE_CXX_FLAGS=${{ matrix.march }} -I$GITHUB_WORKSPACE/src/net/minecraft/src"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/gcc-release --parallel

      - name: Package
        run: |
          mkdir dist
          cp bin/Release/OptiCraft dist/OptiCraft-linux-${{ matrix.suffix }}-gcc
          tar -C dist -czf OptiCraft-linux-${{ matrix.suffix }}-gcc.tar.gz OptiCraft-linux-${{ matrix.suffix }}-gcc

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-linux-${{ matrix.suffix }}-gcc
          path: OptiCraft-linux-${{ matrix.suffix }}-gcc.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats

  # ── Linux 32-bit GCC ─────────────────────────────────────────────────
  # -m32 build (mirrors the gcc32-* presets). SDL video/audio backends that
  # would pick up the host's amd64 dev libraries are disabled explicitly so
  # nothing 64-bit sneaks into a 32-bit link; OpenGL is forced to the legacy
  # (non-GLVND) path so OpenGL::GL resolves to the i386 libGL.so.1 from
  # libgl1:i386 instead of the amd64 libOpenGL/libGLX GLVND libraries.
  build-linux-x86-gcc:
    timeout-minutes: 45
    name: Linux x86 GCC
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if [ ! -f external/SDL_net/CMakeLists.txt ]; then
            echo "Cloning SDL_net..."
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            git -C external/SDL_net fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git -C external/SDL_net checkout FETCH_HEAD
          else
            echo "SDL_net already present"
          fi

      - name: Install build tools (multilib + i386 GL runtime)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y gcc-multilib g++-multilib ninja-build ccache \
            libgl-dev libgl1:i386

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-x86-${{ github.run_id }}
          restore-keys: |
            ccache-linux-x86-

      - name: Configure ccache
        run: ccache --max-size=2G && ccache --set-config=compression=true

      - name: Configure
        run: >
          cmake -B build/gcc32-release -G Ninja
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MAKE_PROGRAM=ninja
          -DMC_LOG_LEVEL=2
          -DCMAKE_C_FLAGS="-m32 -msse2 -mfpmath=sse"
          "-DCMAKE_CXX_FLAGS=-m32 -msse2 -mfpmath=sse -I$GITHUB_WORKSPACE/src/net/minecraft/src"
          -DCMAKE_EXE_LINKER_FLAGS=-m32
          -DCMAKE_SHARED_LINKER_FLAGS=-m32
          -DCMAKE_MODULE_LINKER_FLAGS=-m32
          -DOpenGL_GL_PREFERENCE=LEGACY
          -DOPENGL_gl_LIBRARY=/usr/lib/i386-linux-gnu/libGL.so.1
          -DSDL_X11=OFF
          -DSDL_WAYLAND=OFF
          -DSDL_ALSA=OFF
          -DSDL_PULSEAUDIO=OFF
          -DSDL_UDEV=OFF
          -DSDL_JACK=OFF
          -DSDL_PIPEWIRE=OFF
          -DSDL_SNDIO=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/gcc32-release --parallel

      - name: Package
        run: |
          mkdir dist
          cp bin/Release/OptiCraft dist/OptiCraft-linux-x86-gcc
          tar -C dist -czf OptiCraft-linux-x86-gcc.tar.gz OptiCraft-linux-x86-gcc

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-linux-x86-gcc
          path: OptiCraft-linux-x86-gcc.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats

  # ── Linux ARMv7 (armhf) GCC, cross-compiled ─────────────────────────
  # Mirrors the Linux x86 job: cross arm-linux-gnueabihf toolchain, SDL
  # video/audio backends that would pick up the host's amd64 dev libraries
  # are disabled explicitly, and OpenGL is pinned to the armhf runtime
  # (linking against it is harmless to begin with -- glad resolves GL via
  # dlopen, so no libGL symbols are referenced at link time). armhf packages
  # still live on ports.ubuntu.com (only arm64 joined archive.ubuntu.com in
  # 26.04), so an armhf ports source is added and the stock sources are
  # restricted to the host arches; otherwise apt update 404s asking
  # archive.ubuntu.com for armhf indices. The ports source also lists the
  # -updates and -security pockets: libc6 must be the exact same version on
  # every architecture (libc6:armhf Breaks libc6 (!= same version)), and the
  # runner's amd64 libc6 tracks -security while the base pocket stays frozen
  # at the release version. Subscribing only to the base suite leaves armhf
  # libc6 behind, so every multiarch transaction (cross toolchain, libgl1:armhf)
  # dies with "two conflicting assignments".
  build-linux-armv7-gcc:
    timeout-minutes: 45
    name: Linux ARMv7 GCC
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if [ ! -f external/SDL_net/CMakeLists.txt ]; then
            echo "Cloning SDL_net..."
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            git -C external/SDL_net fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git -C external/SDL_net checkout FETCH_HEAD
          else
            echo "SDL_net already present"
          fi

      - name: Enable armhf multiarch (ports) + install build tools
        run: |
          sudo dpkg --add-architecture armhf
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ] && \
             ! grep -q '^Architectures:' /etc/apt/sources.list.d/ubuntu.sources; then
            sudo awk '/^Types: deb/ { print; print "Architectures: amd64 i386"; next } { print }' \
              /etc/apt/sources.list.d/ubuntu.sources > /tmp/ubuntu.sources
            sudo mv /tmp/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources
          fi
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          # NB: ubuntu-keyring ships the archive keyring as
          # ubuntu-archive-keyring.gpg; a ".pgp" path does not exist on any
          # release, and apt rejects the repo with NO_PUBKEY when Signed-By
          # points at a missing keyring.
          printf '%s\n' \
            'Types: deb' \
            'URIs: http://ports.ubuntu.com/ubuntu-ports' \
            "Suites: $codename $codename-updates $codename-security" \
            'Components: main universe' \
            'Architectures: armhf' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            | sudo tee /etc/apt/sources.list.d/armhf-ports.sources
          sudo apt update
          sudo apt install -y --allow-downgrades crossbuild-essential-armhf ninja-build ccache \
            libgl-dev libgl1:armhf

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-armv7-${{ github.run_id }}
          restore-keys: |
            ccache-linux-armv7-

      - name: Configure ccache
        run: ccache --max-size=2G && ccache --set-config=compression=true

      - name: Configure
        run: >
          cmake -B build/armv7-release -G Ninja
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=arm
          -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc
          -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MAKE_PROGRAM=ninja
          -DMC_LOG_LEVEL=2
          "-DCMAKE_CXX_FLAGS=-I$GITHUB_WORKSPACE/src/net/minecraft/src"
          -DOpenGL_GL_PREFERENCE=LEGACY
          -DOPENGL_gl_LIBRARY=/usr/lib/arm-linux-gnueabihf/libGL.so.1
          -DSDL_X11=OFF
          -DSDL_WAYLAND=OFF
          -DSDL_ALSA=OFF
          -DSDL_PULSEAUDIO=OFF
          -DSDL_UDEV=OFF
          -DSDL_JACK=OFF
          -DSDL_PIPEWIRE=OFF
          -DSDL_SNDIO=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/armv7-release --parallel

      - name: Package
        run: |
          mkdir dist
          cp bin/Release/OptiCraft dist/OptiCraft-linux-armv7-gcc
          tar -C dist -czf OptiCraft-linux-armv7-gcc.tar.gz OptiCraft-linux-armv7-gcc

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-linux-armv7-gcc
          path: OptiCraft-linux-armv7-gcc.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats

  # ── macOS ARM64 / x64 (AppleClang) ───────────────────────────────────
  # Two native jobs instead of one cross-compile: the desktop configure
  # already accepts Apple (CMakeLists' elseif(UNIX) branch keeps the
  # src/pc/linux POSIX implementations and drops only src/pc/win32), and
  # building on each runner's own CPU exercises both slices of the toolchain
  # for real. CMAKE_OSX_ARCHITECTURES is still passed so the artifact cannot
  # silently change arch if a runner label is ever remapped.
  #
  # CMAKE_OSX_DEPLOYMENT_TARGET pins the minimum OS: without it the binaries
  # record the runner's SDK as their floor and only launch on this year's
  # macOS. std::filesystem (Main.cpp) needs 10.15, and arm64 starts at 11.0.
  #
  # No apt-style GL/X11/ALSA packages: the Xcode SDK already ships the Cocoa
  # and OpenGL frameworks SDL2/glad use (glad dlopens OpenGL.framework).
  build-macos:
    timeout-minutes: 45
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 Clang
            runner: macos-26
            suffix: arm64
            arch: arm64
            target: '11.0'
          - name: macOS x64 Clang
            runner: macos-26-intel
            suffix: x64
            arch: x86_64
            target: '10.15'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if [ ! -f external/SDL_net/CMakeLists.txt ]; then
            echo "Cloning SDL_net..."
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            git -C external/SDL_net fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git -C external/SDL_net checkout FETCH_HEAD
          else
            echo "SDL_net already present"
          fi

      - name: Install build tools
        # ninja is not preinstalled on the macOS runner images (the Linux jobs
        # get it from apt, the Windows images ship it); brew is on PATH and
        # re-installing an already-present formula is a no-op.
        run: brew install ninja ccache

      - name: Configure ccache dir
        # Force the same path as the cache step below instead of relying on
        # this ccache build's macOS default (which may be ~/Library/Caches).
        run: echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-macos-${{ matrix.suffix }}-${{ github.run_id }}
          restore-keys: |
            ccache-macos-${{ matrix.suffix }}-

      - name: Configure ccache
        run: ccache --max-size=2G && ccache --set-config=compression=true

      - name: Configure
        run: >
          cmake -B build/clang-release -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MAKE_PROGRAM=ninja
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.target }}
          -DMC_LOG_LEVEL=2
          "-DCMAKE_CXX_FLAGS=-I$GITHUB_WORKSPACE/src/net/minecraft/src"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        # -k 0: this is a first-ever port, and ninja's default is to stop at
        # the first failed TU, which would cost one CI run per compile error
        # across ~1470 objects. Keep going so one run reports every one.
        run: cmake --build build/clang-release --parallel -- -k 0

      - name: Package
        run: |
          mkdir dist
          cp bin/Release/OptiCraft dist/OptiCraft-macos-${{ matrix.suffix }}-clang
          tar -C dist -czf OptiCraft-macos-${{ matrix.suffix }}-clang.tar.gz OptiCraft-macos-${{ matrix.suffix }}-clang

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-macos-${{ matrix.suffix }}-clang
          path: OptiCraft-macos-${{ matrix.suffix }}-clang.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats
